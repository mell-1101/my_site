
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            max-width: 600px;
            padding: 45px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        p {
            color: #666;
            line-height: 1.7;
            margin-bottom: 15px;
        }

        .highlight {
            margin-top: 25px;
            padding: 20px;
            background: #f4f4f4;
            border-left: 4px solid #333;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>About Us</h1>

        <p>
            Welcome to our website! We are passionate about creating
            simple and useful experiences for our visitors.
        </p>

        <p>
            Our goal is to build a place where people can learn,
            explore, and discover something new.
        </p>

        <div class="highlight">
            <strong>Our Mission</strong>
            <p>
                Keep learning, keep building, and keep improving.
            </p>
        </div>
    </div>

</body>
</html>
